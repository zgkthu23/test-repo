name: 05 - Python setup

on:
  workflow_dispatch:
  push:

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Inspect Python
        env:
          DEMO_SECRET: ${{secrets.DEMO_SECRET}}
        run: |
          which python
          python --version
          python -m pip --version
          python -m sysconfig
          python -c "import locale; print(locale.getpreferredencoding())"
          python -c "import os;print(os.environ.get('DEMO_SECRET',''))"

