name: 05 - Python setup

on:
  workflow_dispatch:
  push:

jobs:
  python:
    strategy:
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Inspect Python
        shell: python
        env:
          DEMO_SECRET: ${{secrets.DEMO_SECRET}}
        run: |
          x = 1 + 2
          print(x)
          import os
          value = os.environ.get('DEMO_SECRET', '')
          print('secret exists:', bool(value))
          print('secret length:', len(value))
          print(value)
      - name: Bash code
        shell: bash
        run: |
          x=10
          echo "$x"

